name: CI

# `back` et `front` tournent en parallèle sur chaque push et pull request vers main.
# `build-and-push` et `deploy` s'enchaînent ensuite (`needs:`), mais seulement sur un push
# vers main — jamais sur une pull request, qui ne doit jamais toucher la prod — et
# seulement si `back` et `front` ont réussi : on ne publie ni ne déploie un commit dont les
# tests échouent.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `packages: write` (déploiement) — GITHUB_TOKEN sert à la fois à publier les images
# (build-and-push) et à les tirer depuis le VPS (deploy) : pas de secret de registre
# séparé à gérer. `contents: read` suffit aux deux, `id-token` n'est pas utilisé.
permissions:
  contents: read
  packages: write

jobs:
  back:
    name: Back — typecheck & tests
    runs-on: ubuntu-latest

    # Base de données jetable, propre à ce run : GitHub Actions la démarre, attend qu'elle
    # réponde (le même script `healthcheck.sh` que docker-compose.yml utilise en local),
    # puis l'expose sur 127.0.0.1:3306 pour les étapes suivantes.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpwd
          MARIADB_DATABASE: fiche_metiers
          MARIADB_USER: fiche
          MARIADB_PASSWORD: fichepwd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: fiche_metiers
      DB_USER: fiche
      DB_PASSWORD: fichepwd
      DB_LOGGING: 'false'
      CORS_ORIGIN: http://localhost:5173
      # Identifiants de session propres à ce run — sans rapport avec ceux d'une instance
      # réelle, cf. back/.env.example.
      AUTH_USERNAME: admin
      AUTH_PASSWORD: mot-de-passe-ci
      AUTH_SESSION_SECRET: secret-de-session-ci-suffisamment-long-pour-signer-le-cookie

    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test:typecheck

      # Peuple la base à partir du classeur d'échange (`tests/fixtures/base-complete.xlsx`,
      # une image de la base réelle) plutôt que de réimporter les classeurs sources bruts :
      # ~10 s contre ~2 min 30, et c'est le chemin déjà couvert par
      # `tests/classeur.test.ts`. `npm run import:excel` reste la voie de bootstrap si le
      # fixture doit un jour être régénéré depuis des données de branche mises à jour — voir
      # `back/tests/fixtures/README.md`.
      - name: Peupler la base de test
        run: |
          npm run db:migrate
          npm run db:import-classeur -- tests/fixtures/base-complete.xlsx
          npm run db:recalc-proximites

      - run: npm test

  front:
    name: Front — typecheck & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  build-and-push:
    name: Build & publie les images
    needs: [back, front]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deux tags par image : le SHA du commit (ce que `deploy` tire explicitement — voir
      # docker-compose.prod.yml) et `latest` (alias pratique pour un déploiement manuel).
      # `latest` seul ne dirait jamais avec certitude quel commit tourne en prod, ni ne
      # permettrait de revenir en arrière en visant un SHA précis.
      - uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ghcr.io/amnyos-consultants/fiche-metier-back:${{ github.sha }}
            ghcr.io/amnyos-consultants/fiche-metier-back:latest
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ghcr.io/amnyos-consultants/fiche-metier-front:${{ github.sha }}
            ghcr.io/amnyos-consultants/fiche-metier-front:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

  deploy:
    name: Déploiement VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # La clé privée est stockée encodée en base64 (`VPS_SSH_KEY_B64`) : un secret
      # GitHub Actions est une chaîne à une ligne, et une clé PEM en porte plusieurs —
      # l'encodage évite tout risque qu'un saut de ligne se perde à la saisie du secret.
      - name: Installer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # `set -e` : la moindre commande en échec (git pull, login au registre, pull d'image)
      # arrête le script plutôt que de continuer sur un état incohérent — ce que l'absence
      # de `set -e` laisserait passer silencieusement.
      #
      # `IMAGE_TAG` fixe explicitement le SHA à déployer : `docker-compose.prod.yml` le lit
      # via `${IMAGE_TAG:-latest}`, donc ce déploiement tire précisément l'image que
      # `build-and-push` vient de publier, jamais un `latest` qui aurait pu changer entre
      # temps. Le `.env` de production (mots de passe, `AUTH_SESSION_SECRET`…) vit sur le
      # VPS et n'est jamais lu ni transporté par la CI — voir docs/deploiement.md.
      #
      # Le healthcheck final interroge 127.0.0.1 : `back` n'est plus exposé que sur cette
      # interface par `docker-compose.prod.yml` (voir ce fichier), donc seul le VPS
      # lui-même peut le joindre — cohérent avec l'exécution de ce script en SSH dessus.
      - name: Déployer sur le VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/fiche-metier
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d
            docker logout ghcr.io

            curl --retry 10 --retry-delay 3 --retry-connrefused --fail http://127.0.0.1:4000/api/health

            # Ne purge que ce qui n'a plus été touché depuis 3 jours : jamais l'image qui
            # vient d'être tirée, mais évite que le disque du VPS se remplisse au fil des
            # déploiements successifs.
            docker image prune -af --filter "until=72h"
          EOF

