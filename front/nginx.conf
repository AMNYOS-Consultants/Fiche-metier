# nginx interne au conteneur front : sert le build Vite et route /api vers le back,
# ce qui rend la pile fonctionnelle telle quelle avec `docker compose --profile app up`.
#
# Au déploiement, un reverse proxy en frontal (domaine + TLS) viendra devant ce conteneur.
# Il n'a rien à savoir de /api : il transmet tout à front:80, qui continue de router.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Défaut nginx : 1 Mo. Le classeur d'export/import dépasse largement cette taille
    # (~14 Mo aujourd'hui) — sans ce réglage, l'import échoue en 413 avant même d'atteindre
    # le back, qui ne voit jamais la requête. Alignée sur la limite du back
    # (`raw({ limit: '64mb' })`, back/src/routes/import.routes.ts) : nginx ne doit pas
    # couper plus tôt que ce que le back accepterait.
    client_max_body_size 64m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # L'API est servie sur la même origine que le front : aucun CORS à configurer,
    # et le comportement est identique à celui du proxy Vite en développement.
    location /api/ {
        proxy_pass         http://back:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Les noms de fichiers produits par Vite contiennent un hash de contenu :
    # ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache, sinon un déploiement continue
    # de servir l'ancienne page qui référence des assets supprimés.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Application monopage : toute route inconnue est rendue par React Router.
    # Placé en dernier : /api/ ci-dessus doit gagner, sinon un appel API recevrait
    # index.html en 200 et le front échouerait sur un « Unexpected token '<' ».
    location / {
        try_files $uri $uri/ /index.html;
    }
}
